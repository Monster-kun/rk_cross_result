straight_line_planner_parameters:
  lidar_leaf_size: {
    type: double,
    default_value: 0.1,
    description: "lidar downsample size"
  }
  lidar_cutoff_height: {
    type: double_array,
    default_value: [-0.2, 0.5],
    description: "lidar cutoff height range"
  }
  lidar_cutoff_range: {
    type: double,
    default_value: 6.0,
    description: "lidar cutoff range"
  }
  lidar_offset: {
      type: double_array,
      default_value: [0.38, 0.0, 0.0],
      description: "lidar offset, real [0.4, 0.0, 0.0], fake[0.31, 0.0, 0.29]"
  }  
  ort_voxel_size: {
    type: double,
    default_value: 0.2,
    description: "ort voxel size"
  }
  ort_max_points: {
    type: int,
    default_value: 10,
    description: "max points in each voxel"
  }
  ort_map_size: {
    type: double,
    default_value: 15.0,
    description: "ort map size 2d"
  }
  max_distance: {
    type: double,
    default_value: 2.0,
    description: "max distance to goal"
  }
  desire_velocity: {
    type: double,
    default_value: 0.5,
    description: "desire speed"
  }