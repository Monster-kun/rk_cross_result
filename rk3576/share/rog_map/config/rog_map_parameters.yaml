rog_map:
  ros__parameters:
    main:
      resolution: 0.1
      inflation_resolution: 0.1
      inflation_step: 4
      unk_inflation_en: false
      unk_inflation_step: 1
      map_size: [10.0, 10.0, 3.0]
      fix_map_origin: [0.0, 0.0, 0.0]
      frontier_extraction_en: false
      virtual_ceil_height: 3
      virtual_ground_height: -3
      intensity_thresh: -10
      point_filt_num: 10
    map_sliding:
      enable: true
      threshold: 0.5
    esdf:
      enable: false
      resolution: 0.1
      local_update_box: [10.0, 10.0, 3.0]
    ros_callback:
      enable: true
      input_source: "lidar" # lidar, camera
      use_perception: false
      status_topic: "/localization/msf_status"
      lidar_topic: "/localization/const_scan"
      camera_topic: "/camera/camera/depth/image_rect_raw" # sim: /depth/image_raw, realsense: /camera/camera/depth/image_rect_raw
      perception_topic: "/perception/tracks"
      dynamic_obj_topic: "/people" # for simulation
    visualization:
      enable: true
      inflation_vis: true
      frontier_vis: false
      esdf_vis: false
      unknown_vis: false
      viz_rate: 10.0
      frame_id: "map"
      range: [10.0, 10.0, 3.0]
    ray_casting:
      enable: true
      batch_update_size: 1
      local_update_box: [10.0, 10.0, 3.0]
      ray_range: [0.0, 6.0]
      p_min: 0.12
      p_miss: 0.49
      p_free: 0.499
      p_occ: 0.85
      p_hit: 0.9
      p_max: 0.98
      unk_thresh: 1.0
    

