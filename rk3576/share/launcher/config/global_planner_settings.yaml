global_planner_server:
  ros__parameters:
    global_planner_plugins: ["Lanelet2Planner"]
    Lanelet2Planner:
      plugin: "lanelet2_planner/Lanelet2Planner"
      debug: true
      reference_speed: 1.0 # m/s
      allow_lane_change: true
      allow_lane_invert: true
      w_ref: 10.0
      w_smooth: 1000.0
      w_length: 10.0
      test_mode: false

