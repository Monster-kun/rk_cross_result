# bringup_everything 的默认配置；命令行 launch 参数可覆盖本次启动。
# maps_root 默认使用 maps_folder 包内的 maps 目录。
localization:
  method: "super_lio" # msf / super_lio
  map_name: "2floors"
  relocation:
    mode: "auto" # auto：自动失败达到上限后转手动；manual：直接等待 RViz
    auto_method: "sc" # sc / btc / bbs3d；manual 模式不调用自动算法
    max_auto_attempts: 5 # 包含首次请求；服务返回候选后还需通过本地初始化
    retry_interval_sec: 1.0
    request_timeout_sec: 45.0 # 子图多候选验证预留余量；客户端超时不会取消服务计算
    initialization_timeout_sec: 30.0 # 单个候选位姿的配准/滤波初始化超时
