/msf_localizer_node:
  ros__parameters:
    use_debug_mode: false
    relocation_map_name: "2floors" #
    # everything 由 localization_settings.yaml 统一覆盖重定位策略。
    relocation_method: 2 # 0=SC, 1=BTC, 2=BBS3D
    relocation_mode: "auto"
    relocation_max_auto_attempts: 5
    relocation_retry_interval_sec: 1.0
    relocation_request_timeout_sec: 45.0
    relocation_initialization_timeout_sec: 30.0
    use_odom: false
    wheel_velocity_ratio: 0.1 # sim 0.1, real 1
    registration_type: "FASTVGICP" #" ICP, GICP, GICPOMP,FASTGICP, FASTVGICP, FASTCUDAGICP, NDT, NDTOMP"
