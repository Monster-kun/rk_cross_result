classic_cluster:
  ros__parameters:
    lidar_topic: "/localization/const_scan" #"/localization/const_scan"
    lidar_offset: [0.4, 0.0, 0.0] # real [0.4, 0.0, 0.0], fake[0.31, 0.0, 0.29]
    cluster_type: "voxel" # euclidean, voxel
    euclidean:
      max_cluster_size: 100
      min_cluster_size: 10
      tolerance: 0.15
      use_height: true
    voxel:
      voxel_size: 0.2
      voxel_range: 10
      voxel_search_step: 2
      min_cluster_size: 10
    
yolov8_bytetrack:
  ros__parameters:
    tracking_classes: ["person"] # check coco label
    camera_topic: "/camera/camera/color/image_raw" # realsense: /camera/camera/color/image_raw, sim: /rgbd/image_raw
    show_image: true

hdl_people_tracking:
  ros__parameters:
    input_info: "lidar" # lidar, yolo
    depth_topic: "/camera/camera/depth/image_rect_raw" # realsense: /camera/camera/depth/image_rect_raw, sim: /depth/image_raw
    depth_info_topic: "/camera/camera/depth/camera_info" # realsense: /camera/camera/depth/camera_info, sim: /depth/camera_info

ekf_tracker:
  ros__parameter:
    depth_topic: "/camera/camera/depth/image_rect_raw" # realsense: /camera/camera/depth/image_rect_raw, sim: /depth/image_raw
    depth_info_topic: "/camera/camera/depth/camera_info" # realsense: /camera/camera/depth/camera_info, sim: /depth/camera_info