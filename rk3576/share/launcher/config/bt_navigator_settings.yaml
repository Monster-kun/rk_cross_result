bt_navigator:
  ros__parameters:
    bt_loop_duration: 50 #ms
    default_bt_xml_filename: "navigate_through_poses.xml" # "navigate_through_poses.xml"
    navigators: ["navigate_through_poses"]
    navigate_through_poses:
      plugin: "bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_point_error_code
      - follow_path_error_code
