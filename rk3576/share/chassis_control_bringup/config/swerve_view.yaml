controller_manager:
  ros__parameters:
    update_rate: 50 #Hz

    switch_joints_controller:
      type: ackermann_steering_chassis_controller/AckermannSteeringChassisContoller
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

switch_joints_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
      - joint8
    interface_name: position
