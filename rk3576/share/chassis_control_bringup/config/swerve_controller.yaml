controller_manager:
  ros__parameters:
    update_rate: 100 #Hz
    ackermann_controller:
      type: ackermann_steering_chassis_controller/AckermannSteeringChassisCrontoller
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

ackermann_controller:
  ros__parameters:
    joints:
      - right_forward_pivot_joint 
      - left_forward_pivot_joint
      - right_back_pivot_joint
      - left_back_pivot_joint
      - right_forward_drive_joint
      - left_forward_drive/joint
      - right_back_drive_joint
      - left_back_drive_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

