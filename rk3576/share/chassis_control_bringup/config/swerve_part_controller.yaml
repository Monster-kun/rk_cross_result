spinning_controller:
  ros__parameters:
    motor_name: [right_forward, left_forward, right_back, left_back]
    drive_command_type: velocity
    angular_velocity_limit: [20.0, 40.0]
    debug_mode: false
halt_controller:
  ros__parameters:
    motor_name: [right_forward,left_forward,right_back,left_back]
    drive_command_type: velocity
simple_controller:
  ros__parameters:
    motor_name: [right_forward, left_forward, right_back, left_back]
    drive_command_type: velocity  
    lookahead_distance: 0.8
    kinematics: "dual_ackermann" # "dual_ackermann" or "omni"
