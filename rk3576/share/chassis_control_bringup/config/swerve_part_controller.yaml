controller_manager:
  ros__parameters:
    update_rate: 10 #Hz

    omini_chassis_controller:
      type: omini_chassis_controller/OminiChassisController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    pure_pursuit_controller:
      type: pure_pursuit_controller/PurePursuitController
    # lqr_trajectory_controller:
    #   type: lqr_trajectory_controller/LQRTrajectoryController
    # mpc_trajectory_controller:
    #   type: mpc_trajectory_controller/MPCTrajectoryController
    spinning_controller:
      type: spinning_controller/SpinningController
    # dualackermann_controller:
    #   type: dualackermann_controller/DualackermannController
    halt_controller:
      type: halt_controller/HaltController
    simple_controller:
      type: simple_controller/SimpleController

omini_chassis_controller:
  ros__parameters:
    motor_name: [right_forward, left_forward, right_back, left_back]
    drive_command_type: velocity
    angle_pid:
      p: 2.5
      i: 0.0
      d: 0.3
    velocity_limit: 5.0
pure_pursuit_controller:
  ros__parameters:
    motor_name: [right_forward, left_forward, right_back, left_back]
    drive_command_type: velocity
    angle_pid:
      p: 2.5
      i: 0.0
      d: 0.3
    velocity_limit: 1.0
    ahead_distance: 1.0
    dual_ackermann:
      limit_pivot: 30.0
    debug_mode: false
    velocity_ratio: 1.0
