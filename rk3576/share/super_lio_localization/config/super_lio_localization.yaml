/super_lio_localization_node:
  ros__parameters:
    project_mode: true
    map_name: "platform"
    map_frame_id: "map"
    scan_frame_id: "base_link"
    base_frame_id: "base_link"
    imu_frame_id: "livox_frame" #  old_car: imu   new_car: livox_frame
    relocation_method: 0 # 0=SC, 1=BTC, 2=BBS3D
    # 独立节点默认值；everything 由 launcher/localization_settings.yaml 覆盖。
    relocation_mode: "auto" # auto / manual
    relocation_max_auto_attempts: 5
    relocation_retry_interval_sec: 1.0
    relocation_request_timeout_sec: 45.0
    relocation_initialization_timeout_sec: 30.0
    min_correspondences: 20
    max_bad_frames: 5

    # Super-LIO accepts only a normalized sensor_msgs/msg/PointCloud2 scan and IMU.
    # /scan.header.frame_id must equal scan_frame_id. Each point must contain
    # x, y, z, intensity and a relative point-time field.
    lio.ros.lidar_topic: "/scan"
    lio.ros.imu_topic: "/livox/imu_192_168_1_101"
    lio.ros.point_time_field: "auto" # auto selects curvature, time, then t.
    lio.ros.point_time_scale: 1.0 # Convert the selected field to seconds.
    lio.ros.scan_timestamp_source: "header" # header or receive_end.
    lio.ros.imu_qos_depth: 3000
    lio.ros.scan_qos_depth: 300
    lio.ros.imu_buffer_max_count: 3000
    lio.ros.scan_buffer_max_count: 300
    lio.ros.buffer_window_sec: 30.0
    lio.ros.max_imu_gap_sec: 0.2
    lio.relocation.worker_timeout_sec: 30.0
    # Offline fault-injection hook. Keep at zero in production configurations.
    lio.test.registration_delay_sec: 0.0
    lio.sensor.lidar_type: 8 # Normalized PointCloud2 input.
    lio.sensor.blind: 1.0
    lio.sensor.maxrange: 70.0
    lio.sensor.filter_rate: 3
    lio.sensor.enable_downsample: true
    lio.sensor.voxel_fliter_size: 0.3
    lio.sensor.gravity_norm: 9.7946
    lio.sensor.imu_type: 1
    lio.sensor.imu_na: 0.1
    lio.sensor.imu_ng: 0.1
    lio.sensor.imu_nba: 0.0001
    lio.sensor.imu_nbg: 0.0001

    lio.hash_map.hash_capacity: 2000000
    lio.hash_map.vox_resolution: 0.5
    lio.kf.kf_type: 0
    lio.kf.kf_max_iterations: 4
    lio.kf.kf_align_gravity: true
    lio.kf.kf_quit_eps: 0.001
    lio.output.robot: false
    lio.output.plan_env_world: false
    lio.output.plan_env_body: false
    lio.output.ml_map: false
    lio.output.planner: false
    lio.output.map: false
    lio.output.dense: false
    lio.output.pub_step: 1
    lio.map.save_map: false
    lio.relocation.update_map: false
    lio.eva.timer: false
