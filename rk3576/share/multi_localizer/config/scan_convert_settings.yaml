    sync_tolerance_ms: 10.0
    queue_size: 32
    lidar1:
      topic: "/livox/lidar_192_168_1_131"
      translation: [-0.32, 0.36, 0.06]
      rpy: [0.0, 0.0, 1.5707963267948966]
